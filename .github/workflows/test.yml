name: test

on:
  pull_request:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: my_dev_user
          POSTGRES_PASSWORD: my_dev_password
          POSTGRES_DB: citywatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_dev_user -d citywatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://my_dev_user:my_dev_password@localhost:5432/citywatch_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements-dev.txt

      - run: alembic upgrade head

      - run: pytest -v
