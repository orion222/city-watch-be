[tool.ruff]
# Enable standard linting rules (E, F, I for isort)
lint.select = ["E", "F", "I"]
lint.ignore = []

# Allow lines to be as long as 100 characters
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
